[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "misscat"
version = "1.0.0"
description = "Watch a GitHub repository and run an AI review on every new PR HEAD"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "KJ Kim" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/genonfire/misscat"
Repository = "https://github.com/genonfire/misscat"
Issues = "https://github.com/genonfire/misscat/issues"

[project.scripts]
misscat = "misscat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
misscat = ["default.yml", "py.typed"]
