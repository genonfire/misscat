[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "misscat"
version = "1.3.0"
description = "Watch a GitHub repository and run an AI review on every new PR HEAD (plus BadCat, a review-state watcher with opt-in merge, and badcat-host, its read-only Native Messaging host)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "KJ Kim" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
    "prompt_toolkit>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/genonfire/misscat"
Repository = "https://github.com/genonfire/misscat"
Issues = "https://github.com/genonfire/misscat/issues"

[project.scripts]
misscat = "misscat:main"
badcat = "badcat.cli:main"
badcat-host = "badcat_host.host:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
misscat = ["default.yml", "py.typed", "profiles/*.yml"]
