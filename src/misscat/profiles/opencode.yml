# OpenCode profile: run with `misscat . opencode [--cat N]`. MissCat builds the command
#   opencode run --standalone --format json <reviewer.args> --model <reviewer.model> <prompt>
# Targets OpenCode native V2 v2.0.32. Edit freely: an existing file is never overwritten.
reviewer:
  provider: opencode
  model: "openai/gpt-6-luna#xhigh"   # provider/model#variant, passed to --model unchanged
  args: []                           # extra native `opencode run` options

prompt: |
  Read REVIEW.md if exist and act as the 1st reviewer.
  Use the gh CLI for GitHub operations, including posting the review.
