reviewer:
  # provider: claude
  # model: claude-sonnet-5-5
  # args:
  #   - --allowedTools
  #   - "Bash(gh *)"

  provider: codex
  model: gpt-6.1-sol
  args:
    - --sandbox
    - workspace-write
    - -c
    - sandbox_workspace_write.network_access=true
    - -c
    - model_reasoning_effort=medium

  # provider: codex
  # model: gpt-6-luna
  # args:
  #   - --sandbox
  #   - workspace-write
  #   - -c
  #   - sandbox_workspace_write.network_access=true
  #   - -c
  #   - model_reasoning_effort=max

prompt: |
  Read REVIEW.md and act as the first reviewer.

watch:
  idle: [60, 120, 180, 240, 300]     # seconds; used while nothing has been reviewed yet
  active: [300, 240, 180, 120, 60]   # seconds; used after a PR HEAD has been reviewed

review:
  include_drafts: true
