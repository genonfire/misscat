reviewer:
  # provider: claude
  # model: claude-sonnet-5-5
  # args:
  #   - --allowedTools
  #   - "Bash(gh *)"

  provider: codex
  model: gpt-6.1-sol
  args:
    - --sandbox
    - workspace-write
    - -c
    - sandbox_workspace_write.network_access=true
    - -c
    - apps._default.enabled=false
    - -c
    - model_reasoning_effort=medium

  # provider: codex
  # model: gpt-6-luna
  # args:
  #   - --sandbox
  #   - workspace-write
  #   - -c
  #   - sandbox_workspace_write.network_access=true
  #   - -c
  #   - apps._default.enabled=false
  #   - -c
  #   - model_reasoning_effort=max

  # reviewer:
  # provider: gemini
  # model: gemini-3.8-flash-low
  # args:
  #   - --output-format
  #   - stream-json
  #   - --print-timeout
  #   - 30m

prompt: |
  Read REVIEW.md if exist and act as the 1st reviewer.
  Use the gh CLI for GitHub operations, including posting the review.

watch:
  idle: [60, 120, 180, 240, 300]     # seconds; used while nothing has been reviewed yet
  active: [300, 240, 180, 120, 60]   # seconds; used after a PR HEAD has been reviewed

review:
  include_drafts: true
